# Prüft jeden PR ohne Zugangsdaten (#59), auch Unter-PRs auf Gruppen-Branches
# (#214): Terraform und den Bau der Seite mit Testdaten (#68). Was GCP braucht
# (Regeltests über die Rules API, Terraform-Vorschau), läuft in Cloud Build.
name: Prüfen

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Feste Images in cloudbuild*.yaml, wie in .github/build-images/Dockerfile,
  # die Dependabot aktualisiert (#244).
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cloudbuild=$(grep -ho 'name: gcr\.io/[^ ]*' cloudbuild*.yaml | cut -d' ' -f2 | sort -u)
          dockerfile=$(grep -o '^FROM .*' .github/build-images/Dockerfile | cut -d' ' -f2 | sort -u)
          if [ "$cloudbuild" != "$dockerfile" ]; then
            echo "::error::Images in cloudbuild*.yaml und .github/build-images/Dockerfile angleichen"
            diff <(echo "$cloudbuild") <(echo "$dockerfile")
            exit 1
          fi

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schicht: [gcp, cloudflare, zentrale]
    defaults:
      run:
        working-directory: infra/${{ matrix.schicht }}
    steps:
      - uses: actions/checkout@v7
      # Dieselbe Version wie Infrastructure Manager (infra/apply.sh).
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Wie cloudbuild.yaml, aber mit tools/testdaten statt Firestore und ohne Bilder.
  bau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn data
        env:
          TESTDATEN: tools/testdaten/katalog.json
          STRICT: "1"
          SITE: https://example.org
      - run: npx astro build
        env:
          SITE: https://example.org
      # Ausgeblendete Werke (#181) fehlen auf der Website, die anderen sind da.
      - run: test -e dist/objekte/ob3/index.html && test ! -e dist/objekte/ob4
