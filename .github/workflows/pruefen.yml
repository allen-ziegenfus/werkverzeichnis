# Prüft jeden PR auf main ohne Zugangsdaten (#59). Was GCP braucht (Regeltests
# über die Rules API, Terraform-Vorschau), läuft in Cloud Build.
name: Prüfen

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schicht: [gcp, cloudflare, zentrale]
    defaults:
      run:
        working-directory: infra/${{ matrix.schicht }}
    steps:
      - uses: actions/checkout@v4
      # Dieselbe Version wie Infrastructure Manager (infra/apply.sh).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
